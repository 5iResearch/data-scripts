name: Daily Relative Strength Ladder (Website)

on:
  schedule:
    - cron: "45 9 * * 1-5"   # 9:45 AM UTC, weekdays — after the Stock Lookup website report (9:30)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-relative-strength-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Relative Strength Ladder (Website)
        timeout-minutes: 35
        run: |
          python scripts/generate_relative_strength_web.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/relative-strength/
          git diff --cached --quiet || git commit -m "chore: update relative strength website report [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, rebasing onto origin/main and retrying ($i)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 10 + 1))
          done
