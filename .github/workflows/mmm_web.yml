name: Daily Macro Market Model (Website)

on:
  schedule:
    - cron: "0 9 * * 1-5"    # 9:00 AM UTC, weekdays — after the original MMM charts (Daily Python Scripts, 6:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-mmm-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Macro Market Model website report
        timeout-minutes: 55
        run: |
          python scripts/generate_mmm_web.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/mmm-web/
          git diff --cached --quiet || git commit -m "chore: update macro market model website report [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, rebasing onto origin/main and retrying ($i)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 10 + 1))
          done
