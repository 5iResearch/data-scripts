name: Daily VIX Structure Report

on:
  schedule:
    - cron: "0 7 * * 1-5"   # 7:00 AM UTC, weekdays — offset from Regime Monitors Report (6:45)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-vix-structure-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run VIX Structure report
        timeout-minutes: 50
        run: |
          python scripts/generate_vix_structure_report.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/vix-structure/
          git diff --cached --quiet || git commit -m "chore: update VIX structure report [skip ci]"
          git push
