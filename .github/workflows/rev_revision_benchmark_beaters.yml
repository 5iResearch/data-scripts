name: Daily Revenue Revision Benchmark Beaters

on:
  schedule:
    - cron: "30 7 * * 1-5"   # 7:30 AM UTC, weekdays — offset from Inverse ETF Sentiment (7:15)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-rev-revision-benchmark-beaters:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check revenue revision CSVs are present
        run: |
          for f in data/us_1w_rev_est_screener.csv data/cdn_1w_rev_est_screener.csv; do
            lines=$(wc -l < "$f")
            if [ "$lines" -le 1 ]; then
              echo "::warning::$f has no data rows — did you forget to export/commit today's revision screener?"
            fi
          done

      - name: Run Revenue Revision Benchmark Beaters report
        timeout-minutes: 85
        run: |
          python scripts/generate_rev_revision_benchmark_beaters.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/rev-revision-benchmark-beaters/
          git diff --cached --quiet || git commit -m "chore: update revenue revision benchmark beaters report [skip ci]"
          git push
