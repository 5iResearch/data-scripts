name: Stock Screener (Sharpe / Efficient Frontier)

on:
  schedule:
    - cron: "20 8 * * 1-5"   # 8:20 AM UTC, weekdays — offset from CDN Channel Screener (8:10)
  workflow_dispatch:
    inputs:
      extra_tickers:
        description: 'Comma-separated tickers to add to the efficient frontier (e.g. RY.TO,SHOP.TO,ASML)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-stock-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Stock Screener
        timeout-minutes: 50
        env:
          EXTRA_TICKERS: ${{ inputs.extra_tickers }}
        run: |
          python scripts/generate_stock_screener.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/stock-screener/
          git diff --cached --quiet || git commit -m "chore: update stock screener report [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, rebasing onto origin/main and retrying ($i)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 10 + 1))
          done
