name: Daily Efficient Frontier (Website)

on:
  schedule:
    - cron: "40 8 * * 1-5"   # 8:40 AM UTC, weekdays — after the Stock Screener (8:20), which downloads the same ~1,000 tickers
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-efficient-frontier-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Efficient Frontier website report
        timeout-minutes: 40
        run: |
          python scripts/generate_efficient_frontier_web.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/efficient-frontier/
          git diff --cached --quiet || git commit -m "chore: update efficient frontier website report [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, rebasing onto origin/main and retrying ($i)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 10 + 1))
          done
