name: Daily Canadian & US Sector Quadrant Report

on:
  schedule:
    - cron: "50 6 * * 1-5"   # 6:50 AM UTC, weekdays — offset from Regime Monitors Report (6:45)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-cdn-sector-quadrant-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Canadian & US Sector Quadrant report
        timeout-minutes: 20
        run: |
          python scripts/generate_cdn_sector_quadrant_report.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/regime-monitors/CDN_Sector_Quadrant_Report.html
          git diff --cached --quiet || git commit -m "chore: update canadian & us sector quadrant report [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, rebasing onto origin/main and retrying ($i)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 10 + 1))
          done
