name: Daily Regression Channel Screener (Website)

on:
  schedule:
    - cron: "15 8 * * 1-5"   # 8:15 AM UTC, weekdays — after the US (7:50) and CDN (8:00) channel screeners
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-channel-screener-web:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Channel Screener (Website)
        timeout-minutes: 80
        run: |
          python scripts/generate_channel_screener_web.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/channel-screener-web/
          git diff --cached --quiet || git commit -m "chore: update website channel screener [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, rebasing onto origin/main and retrying ($i)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 10 + 1))
          done
