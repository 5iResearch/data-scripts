name: Daily Index 200-Week MA (Website)

on:
  schedule:
    - cron: "0 7 * * 1-5"    # 7:00 AM UTC, weekdays — after the Index RSI website report (6:45)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-index-200wma-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Index 200-week MA website report
        timeout-minutes: 15
        run: |
          python scripts/generate_index_200wma_web.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/index-200wma/
          git diff --cached --quiet || git commit -m "chore: update index 200-week MA website report [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, rebasing onto origin/main and retrying ($i)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 10 + 1))
          done
