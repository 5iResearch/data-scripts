name: Daily Volatility Breadth (Website)

on:
  schedule:
    - cron: "25 7 * * 1-6"   # 7:25 AM UTC, Mon-Sat (Sat picks up Friday's close) — after the VIX website report (7:15)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-vol-breadth-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run volatility breadth website report
        timeout-minutes: 15
        run: |
          python scripts/generate_vol_breadth_web.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/vol-breadth/
          git diff --cached --quiet || git commit -m "chore: update volatility breadth website report [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, rebasing onto origin/main and retrying ($i)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 10 + 1))
          done
