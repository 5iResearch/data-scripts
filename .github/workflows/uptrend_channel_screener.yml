name: Daily 1-Year Uptrend Channel Screener

on:
  schedule:
    - cron: "5 8 * * 1-5"   # 8:05 AM UTC, weekdays — offset from other daily reports
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-uptrend-channel-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Uptrend Channel Screener report
        timeout-minutes: 50
        run: |
          python scripts/generate_uptrend_channel_screener.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/uptrend-channel-screener/
          git diff --cached --quiet || git commit -m "chore: update uptrend channel screener report [skip ci]"
          git push
