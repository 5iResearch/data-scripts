name: Drives Earnings & Sales Screener ($2B-$35B + $35B+)

on:
  push:
    branches: [main]
    paths:                    # inputs are manual exports — rebuild as soon as a fresh one is pushed
      - data/drives_earnings_sales_2_35.csv
      - data/drives_earnings_sales_35_plus.csv
      - data/etf_holdings.csv
      - scripts/generate_drives_earnings_sales_screener.py
  schedule:
    - cron: "55 8 * * 1"      # 8:55 AM UTC, Mondays — weekly refresh, offset from Ratio Channel Lookup (8:45)
  workflow_dispatch:

permissions:
  contents: write

concurrency:                  # a manual run fired during a push-triggered one would otherwise race it
  group: drives-earnings-sales-screener
  cancel-in-progress: false

jobs:
  run-drives-earnings-sales-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # ~1,650-ticker 10Y price download for the Beat-QQQ column

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full commit history so the report's "data as of" date comes from
          filter: blob:none     # the last commit touching the input CSV (blobless keeps it light)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check input CSVs are present
        run: |
          for f in data/drives_earnings_sales_2_35.csv data/drives_earnings_sales_35_plus.csv; do
            lines=$(wc -l < "$f")
            if [ "$lines" -le 1 ]; then
              echo "::warning::$f has no data rows — did you forget to export/commit the screener pull?"
            fi
          done

      - name: Run Drives Earnings & Sales Screener
        timeout-minutes: 25
        run: |
          python scripts/generate_drives_earnings_sales_screener.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/drives-earnings-sales-screener/
          git diff --cached --quiet || git commit -m "chore: update drives earnings & sales screener report [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, rebasing onto origin/main and retrying ($i)..."
            git fetch origin main
            # -X theirs = keep this run's freshly generated outputs if an earlier run touched the same files
            git rebase -X theirs origin/main
            sleep $((RANDOM % 10 + 1))
          done
